<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>FELMOR — Mobilidade Particular</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080808">

<script src="core/datamanager.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="core/supabase.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#080808;--surface:#0f0f0f;--surface-2:#161616;--graphite:#121212;
  --line:rgba(255,255,255,.06);--line-strong:rgba(255,255,255,.12);
  --gold:#D4AF37;--gold-light:#F6D365;--gold-soft:rgba(212,175,55,.14);
  --silver:#D9D9D9;--text:#F8F9FA;--muted:#8a8a8a;
  --success:#34d399;--danger:#f87171;--radius:18px;--radius-sm:12px;
  --shadow-elev:0 20px 60px -20px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.4);
  --shadow-gold:0 8px 30px -8px rgba(212,175,55,.45);
  --grad-gold:linear-gradient(135deg,#F6D365 0%,#D4AF37 55%,#a8862a 100%);
  --grad-surface:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
body{padding-top:env(safe-area-inset-top);min-height:100vh;background:radial-gradient(1200px 600px at 50% -200px,rgba(212,175,55,.10),transparent 60%),radial-gradient(800px 400px at 100% 100%,rgba(212,175,55,.04),transparent 60%),#080808}
.header{position:relative;padding:22px 20px 18px;text-align:center;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(212,175,55,.06),transparent)}
.brand-mark{width:54px;height:54px;margin:0 auto 10px;border-radius:16px;background:var(--grad-gold);display:grid;place-items:center;font-family:'Playfair Display',serif;font-weight:700;font-size:24px;color:#1a1300;box-shadow:var(--shadow-gold),inset 0 1px 0 rgba(255,255,255,.4);letter-spacing:-1px}
.brand-name{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;letter-spacing:.5px;background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-sub{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:500}
.app-container{padding:18px 16px 140px;max-width:520px;margin:0 auto}
.card{background:var(--surface);background-image:var(--grad-surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--shadow-elev);animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card-label{font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-label:before{content:"";width:14px;height:1px;background:var(--gold);opacity:.6}
.timeline{position:relative;padding-left:8px}
.tl-line{position:absolute;left:18px;top:24px;bottom:24px;width:1px;background:linear-gradient(180deg,#22c55e,#D4AF37,#f87171);opacity:.4}
.tl-row{display:flex;align-items:center;gap:14px;padding:14px 14px 14px 0;border-radius:14px;cursor:pointer;position:relative;transition:background .25s ease,transform .15s ease}
.tl-row:hover{background:rgba(255,255,255,.025)}.tl-row:active{transform:scale(.99)}
.tl-dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:var(--surface-2);border:2px solid;position:relative;z-index:1}
.tl-row.origem .tl-dot{border-color:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.1)}
.tl-row.parada .tl-dot{border-color:#D4AF37;box-shadow:0 0 0 4px rgba(212,175,55,.12)}
.tl-row.destino .tl-dot{border-color:#f87171;box-shadow:0 0 0 4px rgba(248,113,113,.1)}
.tl-dot:after{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.tl-row.origem .tl-dot:after{background:#22c55e}.tl-row.parada .tl-dot:after{background:#D4AF37}.tl-row.destino .tl-dot:after{background:#f87171}
.tl-content{flex:1;min-width:0}.tl-title{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:3px}
.tl-text{font-size:15px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-text.placeholder{color:var(--muted);font-weight:400}.tl-chev{color:var(--muted);font-size:18px;flex-shrink:0}
.add-parada{display:inline-flex;align-items:center;gap:6px;margin:6px 0 0 38px;font-size:13px;color:var(--gold);font-weight:500;cursor:pointer;padding:6px 10px;border-radius:8px;transition:background .2s}
.add-parada:hover{background:var(--gold-soft)}.add-parada.hide{display:none}
.value-card{position:relative;background:radial-gradient(600px 200px at 50% 0%,rgba(212,175,55,.15),transparent 70%),var(--surface);border:1px solid rgba(212,175,55,.25);text-align:center;padding:24px 16px;overflow:hidden}
.value-card:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(212,175,55,.05) 50%,transparent 60%);pointer-events:none}
.value-label{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
.value-amount{font-family:'Playfair Display',serif;font-size:42px;font-weight:700;letter-spacing:-1px;background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 12px rgba(212,175,55,.3));transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.value-amount.pulse{animation:pulse .5s ease}@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
.vehicle{display:flex;align-items:center;gap:14px;background:var(--surface-2);border:1.5px solid var(--gold);border-radius:14px;padding:14px 16px;box-shadow:0 0 0 4px rgba(212,175,55,.08)}
.vehicle-icon{width:44px;height:44px;border-radius:12px;background:var(--grad-gold);display:grid;place-items:center;font-size:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.vehicle-info{flex:1}.vehicle-name{font-size:15px;font-weight:600}.vehicle-desc{font-size:12px;color:var(--muted);margin-top:2px}.vehicle-check{color:var(--gold);font-size:20px}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center;cursor:pointer;transition:all .2s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;align-items:center;gap:6px}
.pay:hover{border-color:var(--line-strong);transform:translateY(-1px)}.pay-icon{font-size:22px}.pay-name{font-size:13px;font-weight:500;color:var(--text)}
.pay.ativo{background:linear-gradient(180deg,rgba(212,175,55,.12),rgba(212,175,55,.04));border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.1),inset 0 1px 0 rgba(255,255,255,.05)}
.pay.ativo .pay-name{color:var(--gold-light)}
.addons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;transition:border-color .2s}
.field:focus-within{border-color:var(--gold)}
.field-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.field select,.field input{background:transparent;border:none;outline:none;color:var(--text);font-family:inherit;font-size:14px;font-weight:500;padding:2px 0;width:100%;appearance:none;-webkit-appearance:none}
.field select option{background:var(--surface);color:var(--text)}.field.full{grid-column:1/-1}
.field input[type=time]::-webkit-calendar-picker-indicator{filter:invert(.8) sepia(1) saturate(5) hue-rotate(10deg);cursor:pointer}
.cta-box{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(8,8,8,.85) 25%,#080808 60%);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:50}
.cta-btn{width:100%;padding:18px;border:none;border-radius:16px;background:var(--grad-gold);color:#1a1300;font-family:inherit;font-weight:700;font-size:16px;letter-spacing:.5px;cursor:pointer;box-shadow:var(--shadow-gold),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .15s ease,box-shadow .2s ease;display:flex;align-items:center;justify-content:center;gap:10px}
.cta-btn:hover{transform:translateY(-1px);box-shadow:0 12px 36px -8px rgba(212,175,55,.55),inset 0 1px 0 rgba(255,255,255,.4)}.cta-btn:active{transform:scale(.98)}.cta-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}.cta-btn .wa{font-size:18px}
.modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);align-items:flex-end;justify-content:center;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-content{width:100%;max-width:520px;background:var(--surface);border-top:1px solid var(--line-strong);border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:85vh;display:flex;flex-direction:column;animation:slideUp .35s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 60px rgba(0,0,0,.6)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.modal-handle{width:40px;height:4px;background:var(--line-strong);border-radius:2px;margin:-8px auto 14px}
.modal input{width:100%;padding:14px 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:15px;outline:none;margin-bottom:12px}
.modal input:focus{border-color:var(--gold)}.lista{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:4px}
.lista div{padding:14px 16px;border-radius:10px;cursor:pointer;font-size:14px;transition:background .15s;border:1px solid transparent}
.lista div:hover{background:var(--surface-2);border-color:var(--line)}.lista-vazia{color:var(--muted);padding:18px 12px;text-align:center;font-size:13px}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}
@media(max-width:380px){.value-amount{font-size:36px}.brand-name{font-size:18px}}
</style>
</head>
<body>

<header class="header">
  <div class="brand-mark">F</div>
  <div class="brand-name">FELMOR</div>
  <div class="brand-sub">Mobilidade Particular</div>
</header>

<main class="app-container">
  <section class="card">
    <div class="card-label">Sua Rota</div>
    <div class="timeline">
      <div class="tl-line"></div>
      <div class="tl-row origem" id="origemBtn" role="button" tabindex="0">
        <div class="tl-dot"></div><div class="tl-content"><div class="tl-title">Origem</div><div class="tl-text placeholder" id="origemTexto">Selecionar origem</div></div><div class="tl-chev">›</div>
      </div>
      <div class="tl-row parada" id="paradaBtn" style="display:none" role="button" tabindex="0">
        <div class="tl-dot"></div><div class="tl-content"><div class="tl-title">Parada</div><div class="tl-text placeholder" id="paradaTexto">Selecionar parada</div></div><div class="tl-chev">›</div>
      </div>
      <div class="tl-row destino" id="destinoBtn" role="button" tabindex="0">
        <div class="tl-dot"></div><div class="tl-content"><div class="tl-title">Destino</div><div class="tl-text placeholder" id="destinoTexto">Selecionar destino</div></div><div class="tl-chev">›</div>
      </div>
    </div>
    <div class="add-parada" id="addParada">+ Adicionar parada</div>
  </section>

  <section class="card">
    <div class="card-label">Veículo</div>
    <div class="vehicle">
      <div class="vehicle-icon">🚗</div><div class="vehicle-info"><div class="vehicle-name">Executivo</div><div class="vehicle-desc">4 lugares • Conforto premium</div></div><div class="vehicle-check">✓</div>
    </div>
    <input type="hidden" id="tipoCarro" value="1">
  </section>

  <section class="card value-card">
    <div class="value-label">Valor Estimado</div><div class="value-amount" id="previewTotal">R$ 0,00</div>
  </section>

  <section class="card">
    <div class="card-label">Pagamento</div>
    <div class="pay-grid">
      <div class="pay ativo" data="dinheiro" role="button" tabindex="0"><div class="pay-icon">💵</div><div class="pay-name">Dinheiro</div></div>
      <div class="pay" data="pix" role="button" tabindex="0"><div class="pay-icon">⚡</div><div class="pay-name">PIX</div></div>
      <div class="pay" data="credito" role="button" tabindex="0"><div class="pay-icon">💳</div><div class="pay-name">Crédito</div></div>
      <div class="pay" data="debito" role="button" tabindex="0"><div class="pay-icon">🏧</div><div class="pay-name">Débito</div></div>
    </div>
  </section>

  <section class="card">
    <div class="card-label">Adicionais</div>
    <div class="addons">
      <label class="field"><span class="field-label">🛒 Feira</span><select id="feira"><option value="0">Nenhuma</option><option value="4.99">1 carrinho</option><option value="7.99">2 carrinhos</option></select></label>
      <label class="field"><span class="field-label">🐶 Animal</span><select id="animal"><option value="0">Nenhum</option><option value="4.99">Pequeno</option><option value="7.99">Médio</option><option value="11.99">Grande</option></select></label>
      <label class="field"><span class="field-label">⏱️ Espera (min)</span><input type="number" id="espera" placeholder="0" min="0" step="1" inputmode="numeric"></label>
      <label class="field"><span class="field-label">⛱️ Saída Praia</span><select id="saidaPraia"><option value="0">Não</option><option value="9.99">Sim</option></select></label>
    </div>
  </section>

  <section class="card">
    <div class="card-label">Horário de Embarque</div>
    <label class="field full"><span class="field-label">🕐 Horário</span><input type="time" id="embarque"></label>
  </section>
</main>

<div class="cta-box">
  <button class="cta-btn" id="btnContinuar" type="button" disabled><span class="wa">📱</span><span>Solicitar Viagem</span></button>
</div>

<div class="modal" id="modal" aria-hidden="true">
  <div class="modal-content" role="dialog" aria-modal="true" aria-label="Selecionar local">
    <div class="modal-handle"></div>
    <input type="text" id="busca" placeholder="Buscar local..." autocomplete="off">
    <div class="lista" id="lista"></div>
  </div>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);
const origemBtn=$("origemBtn"), destinoBtn=$("destinoBtn"), paradaBtn=$("paradaBtn");
const addParada=$("addParada"), origemTexto=$("origemTexto"), destinoTexto=$("destinoTexto");
const paradaTexto=$("paradaTexto"), lista=$("lista"), busca=$("busca"), modal=$("modal");
const previewTotal=$("previewTotal"), feira=$("feira"), animal=$("animal");
const espera=$("espera"), saidaPraia=$("saidaPraia"), embarque=$("embarque");
const tipoCarro=$("tipoCarro"), btnContinuar=$("btnContinuar");

let origem=null, destino=null, parada=null, modo=null, pagamento="dinheiro";
let listaAtual=[];
let dadosProntos=false;

const moeda = valor => new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(valor)||0);

async function iniciar(){
  try{
    if(!window.DataManager) throw new Error("O arquivo core/datamanager.js não foi carregado.");
    await DataManager.carregar();
    dadosProntos=true;
    btnContinuar.disabled=false;
  }catch(erro){
    console.error("Erro ao carregar os dados:",erro);
    alert("Não foi possível carregar a tabela de rotas. Verifique os arquivos core/datamanager.js e os dados de tarifas.");
  }
}

function abrirModal(tipo){
  if(!dadosProntos) return alert("Aguarde o carregamento das rotas.");
  modo=tipo;
  busca.value="";
  let dados=[];
  if(tipo==="origem"){
    dados=DataManager.listarOrigens()||[];
  }else if(tipo==="parada"){
    if(!origem) return alert("Selecione a origem primeiro.");
    dados=DataManager.listarDestinos(origem)||[];
  }else if(tipo==="destino"){
    if(!origem) return alert("Selecione a origem primeiro.");
    dados=DataManager.listarDestinos(parada||origem)||[];
  }
  listaAtual=Array.isArray(dados)?dados:[];
  renderLista(listaAtual);
  modal.style.display="flex";
  modal.setAttribute("aria-hidden","false");
  setTimeout(()=>busca.focus(),80);
}

function renderLista(arr){
  lista.innerHTML="";
  if(!arr.length){
    const vazio=document.createElement("div");
    vazio.className="lista-vazia";
    vazio.textContent="Nenhum local encontrado.";
    lista.appendChild(vazio);
    return;
  }
  arr.forEach(item=>{
    const nome=String(item);
    const div=document.createElement("div");
    div.textContent=nome;
    div.setAttribute("role","button");
    div.tabIndex=0;
    div.addEventListener("click",()=>{selecionar(nome);fecharModal();});
    div.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();selecionar(nome);fecharModal();}});
    lista.appendChild(div);
  });
}

function fecharModal(){
  modal.style.display="none";
  modal.setAttribute("aria-hidden","true");
}

function definirTexto(elemento,valor,placeholder){
  elemento.textContent=valor||placeholder;
  elemento.classList.toggle("placeholder",!valor);
}

function selecionar(valor){
  if(modo==="origem"){
    origem=valor;
    parada=null;
    destino=null;
    definirTexto(origemTexto,origem,"Selecionar origem");
    definirTexto(paradaTexto,null,"Selecionar parada");
    definirTexto(destinoTexto,null,"Selecionar destino");
    paradaBtn.style.display="none";
    addParada.classList.remove("hide");
  }else if(modo==="parada"){
    if(valor===origem) return alert("A parada não pode ser igual à origem.");
    parada=valor;
    destino=null;
    definirTexto(paradaTexto,parada,"Selecionar parada");
    definirTexto(destinoTexto,null,"Selecionar destino");
  }else if(modo==="destino"){
    if(valor===origem) return alert("O destino não pode ser igual à origem.");
    if(parada && valor===parada) return alert("O destino não pode ser igual à parada.");
    destino=valor;
    definirTexto(destinoTexto,destino,"Selecionar destino");
  }
  calcular();
}

function obterCalculo(){
  if(!origem||!destino) return {base:0,taxas:0,total:0,detalhes:[]};

  const trecho1=Number(DataManager.buscarValor(origem,parada||destino))||0;
  const trecho2=parada?(Number(DataManager.buscarValor(parada,destino))||0):0;
  const base=trecho1+trecho2;
  let taxas=0;
  const detalhes=[];

  const feiraVal=Number(feira.value)||0;
  const animalVal=Number(animal.value)||0;
  const praiaVal=Number(saidaPraia.value)||0;
  const esperaVal=Math.max(0,Number(espera.value)||0);

  if(feiraVal>0){taxas+=feiraVal;detalhes.push(`🛒 Feira: ${moeda(feiraVal)}`);}
  if(animalVal>0){taxas+=animalVal;detalhes.push(`🐶 Animal: ${moeda(animalVal)}`);}
  if(praiaVal>0){taxas+=praiaVal;detalhes.push(`⛱️ Saída praia: ${moeda(praiaVal)}`);}
  if(esperaVal>5){
    const valorEspera=3+((esperaVal-5)*0.6);
    taxas+=valorEspera;
    detalhes.push(`⏱️ Espera (${esperaVal} min): ${moeda(valorEspera)}`);
  }
  if(embarque.value){
    const [h,m]=embarque.value.split(":").map(Number);
    const minutos=h*60+m;
    if(minutos>=1350||minutos<300){
      const noturno=base<=24.99?5:base*0.35;
      taxas+=noturno;
      detalhes.push(`🌙 Adicional noturno: ${moeda(noturno)}`);
    }
  }

  let total=(base+taxas)*(Number(tipoCarro.value)||1);
  if(pagamento==="credito") total/=0.95;
  if(pagamento==="debito") total/=0.98;

  return {base,taxas,total,detalhes};
}

function calcular(){
  const resultado=obterCalculo();
  previewTotal.textContent=moeda(resultado.total);
  previewTotal.classList.remove("pulse");
  void previewTotal.offsetWidth;
  previewTotal.classList.add("pulse");
}

function solicitarViagem(){
  if(!dadosProntos) return alert("Aguarde o carregamento das rotas.");
  if(!origem||!destino) return alert("Selecione a origem e o destino.");
  const resultado=obterCalculo();

  if(resultado.base<=0) return alert("Não foi encontrada uma tarifa válida para essa rota. Confira a origem, a parada e o destino.");

  let msg="🚖 *FELMOR - Solicitação de Viagem*\n\n";
  msg+=`📍 *Origem:*\n${origem}\n\n`;
  if(parada) msg+=`🛑 *Parada:*\n${parada}\n\n`;
  msg+=`🏁 *Destino:*\n${destino}\n\n`;
  msg+=`💰 Subtotal: ${moeda(resultado.base)}\n\n`;
  msg+="──────────────\n📋 *Detalhes*\n";
  msg+=resultado.detalhes.length?resultado.detalhes.join("\n")+"\n":"Sem adicionais\n";
  msg+=`\n💸 Taxas: ${moeda(resultado.taxas)}\n`;
  msg+="──────────────\n";
  msg+=`💳 Pagamento: ${pagamento.toUpperCase()}\n\n`;
  msg+=`💰 *TOTAL: ${moeda(resultado.total)}*`;

  const telefone="5581989823239";
  const url=`https://wa.me/${telefone}?text=${encodeURIComponent(msg)}`;
  window.open(url,"_blank","noopener,noreferrer");
}

origemBtn.addEventListener("click",()=>abrirModal("origem"));
destinoBtn.addEventListener("click",()=>abrirModal("destino"));
paradaBtn.addEventListener("click",()=>abrirModal("parada"));

[origemBtn,destinoBtn,paradaBtn].forEach(el=>{
  el.addEventListener("keydown",e=>{
    if(e.key==="Enter"||e.key===" "){e.preventDefault();el.click();}
  });
});

addParada.addEventListener("click",()=>{
  if(!origem) return alert("Selecione a origem primeiro.");
  parada=null;
  destino=null;
  definirTexto(paradaTexto,null,"Selecionar parada");
  definirTexto(destinoTexto,null,"Selecionar destino");
  paradaBtn.style.display="flex";
  addParada.classList.add("hide");
  abrirModal("parada");
});

modal.addEventListener("click",e=>{if(e.target===modal) fecharModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modal.style.display==="flex") fecharModal();});
busca.addEventListener("input",()=>{
  const termo=busca.value.trim().toLocaleLowerCase("pt-BR");
  renderLista(listaAtual.filter(item=>String(item).toLocaleLowerCase("pt-BR").includes(termo)));
});

document.querySelectorAll(".pay").forEach(opcao=>{
  const escolher=()=>{
    document.querySelectorAll(".pay").forEach(item=>item.classList.remove("ativo"));
    opcao.classList.add("ativo");
    pagamento=opcao.getAttribute("data");
    calcular();
  };
  opcao.addEventListener("click",escolher);
  opcao.addEventListener("keydown",e=>{
    if(e.key==="Enter"||e.key===" "){e.preventDefault();escolher();}
  });
});

["feira","animal","espera","saidaPraia","embarque"].forEach(id=>{
  const campo=$(id);
  campo.addEventListener("change",calcular);
  campo.addEventListener("input",calcular);
});

btnContinuar.addEventListener("click",solicitarViagem);
iniciar();
</script>
